<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КНБ — Золотые Монеты</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin: 0; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #ffd700; font-family: 'Press Start 2P', cursive; text-align: center; min-height: 100vh; }
        .container { padding: 20px; max-width: 900px; margin: auto; }
        h1 { text-shadow: 0 0 15px #ffd700; }
        .balance { font-size: 1.5em; margin: 15px 0; }
        .stake-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 30px 0; }
        .stake-btn { background: #ffd700; color: #1a1a2e; border: none; padding: 20px 10px; font-size: 1.1em; cursor: pointer; box-shadow: 0 5px 0 #b8860b; }
        .stake-btn:hover { transform: scale(1.05); }
        .popular::after { content: " 🔥"; font-size: 0.8em; }
        .choices { display: flex; justify-content: center; gap: 40px; margin: 50px 0; }
        .choice { font-size: 5em; padding: 20px; border: 6px solid #ffd700; border-radius: 25px; cursor: pointer; }
        .choice:hover { transform: scale(1.15); }
        #status { font-size: 1.3em; min-height: 80px; margin: 20px; }
        button { margin: 10px; padding: 12px 24px; font-size: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🪙 КАМЕНЬ НОЖНИЦЫ БУМАГА 🪙</h1>
        <div class="balance">Баланс: <strong id="coins">500</strong> 🪙</div>

        <div id="menu">
            <h2>Выберите ставку</h2>
            <div class="stake-buttons">
                <button class="stake-btn" onclick="startGame(10)">10 🪙</button>
                <button class="stake-btn" onclick="startGame(25)">25 🪙</button>
                <button class="stake-btn popular" onclick="startGame(50)">50 🪙</button>
                <button class="stake-btn" onclick="startGame(100)">100 🪙</button>
                <button class="stake-btn" onclick="startGame(250)">250 🪙</button>
            </div>
        </div>

        <div id="gameArea" style="display:none;">
            <div class="choices" id="choices">
                <div class="choice" onclick="makeChoice('rock')">🪨</div>
                <div class="choice" onclick="makeChoice('scissors')">✂️</div>
                <div class="choice" onclick="makeChoice('paper')">📄</div>
            </div>
            <div id="status">Ожидание противника...</div>
            <button onclick="leaveCurrentGame()">Выйти</button>
        </div>

        <div id="resultArea" style="display:none;">
            <h2 id="resultText"></h2>
            <button onclick="backToMenu()">Играть снова</button>
        </div>
    </div>

    <script type="module">
    import { ConvexClient } from "https://esm.sh/convex@1/browser";

    const convex = new ConvexClient("https://trustworthy-bison-190.eu-west-1.convex.cloud");

    let userId = null;
    let playerCoins = 500;
    let currentGameId = null;
    let isHost = false;
    let currentStake = 0;

    const choicesMap = { rock: '🪨', scissors: '✂️', paper: '📄' };

    // Глобальные функции для onclick
    window.startGame = startGame;
    window.makeChoice = makeChoice;
    window.leaveCurrentGame = leaveCurrentGame;
    window.backToMenu = backToMenu;

    async function initUser() {
        try {
            const user = await convex.mutation("users:getOrCreateUser", {});
            userId = user.tokenIdentifier;
            playerCoins = user.coins || 500;
            document.getElementById('coins').textContent = playerCoins;
            console.log("✅ Пользователь создан:", userId);
        } catch (e) {
            console.error(e);
            alert("Ошибка подключения");
        }
    }

    async function startGame(stake) {
        if (playerCoins < stake) return alert(`Недостаточно монет! Нужно ${stake} 🪙`);

        try {
            const result = await convex.mutation("games:createGame", { stake });
            currentGameId = result.gameId;
            isHost = true;
            currentStake = stake;
            enterGameScreen(`Игра на ${stake} 🪙 создана. Ожидаем противника...`);
        } catch (error) {
            alert(error.message || "Не удалось создать игру");
        }
    }

    function enterGameScreen(text) {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
        document.getElementById('status').textContent = text;
    }

    async function makeChoice(choice) {
        if (!currentGameId) return;
        try {
            await convex.mutation("games:makeChoice", { gameId: currentGameId, choice });
            document.getElementById('status').innerHTML = `Вы выбрали: ${choicesMap[choice]}<br>Ожидаем противника...`;
            document.getElementById('choices').style.display = 'none';
            listenForResult();
        } catch (error) {
            alert(error.message || "Ошибка хода");
        }
    }

    function listenForResult() {
        const interval = setInterval(async () => {
            try {
                const result = await convex.mutation("endGame", { gameId: currentGameId });
                if (result && result.resultText) {
                    clearInterval(interval);
                    document.getElementById('gameArea').style.display = 'none';
                    document.getElementById('resultArea').style.display = 'block';
                    document.getElementById('resultText').innerHTML = result.resultText;

                    const user = await convex.query("users:getUser", {});
                    if (user) {
                        playerCoins = user.coins;
                        document.getElementById('coins').textContent = playerCoins;
                    }
                }
            } catch (e) {}
        }, 1000);
    }

    function leaveCurrentGame() { backToMenu(); }

    function backToMenu() {
        currentGameId = null;
        document.getElementById('gameArea').style.display = 'none';
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        document.getElementById('choices').style.display = 'flex';
    }

    // Запуск
    initUser();
</script>
</body>
</html>
